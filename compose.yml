services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hireflow_ai
      POSTGRES_USER: hireflow
      POSTGRES_PASSWORD: hireflow123
    ports:
      - "5434:5432"
    volumes:
      - hireflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hireflow -d hireflow_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  hireflow_postgres_data:
